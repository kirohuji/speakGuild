learning:
  exercises:
    pipeline:
      - key: come-to-office
        kind: chunk
        type: chunk_substitution
        title: 问对方明天来不来办公室
        chunk: come to the office
        chunkMeaning: 来办公室
        direction: zh_to_en
        items:
          - zh: 你明天来办公室吗？
            answer: Are you coming to the office tomorrow?
            hint: 疑问句；进行时表将来
          - zh: 他每天早上九点来办公室。
            answer: He comes to the office at nine every morning.
            hint: comes；every morning
          - zh: 今天为什么没人来办公室？
            answer: Why isn't anyone coming to the office today?
            hint: Why isn't；anyone
      - key: come-here
        kind: chunk
        type: chunk_substitution
        title: 叫对方过来一下
        chunk: come here
        chunkMeaning: 过来这里
        direction: zh_to_en
        items:
          - zh: 过来一下。
            answer: Come here for a second.
            hint: for a second
          - zh: 你能过来一下吗？
            answer: Can you come here for a minute?
            hint: for a minute
          - zh: 别站在门口，进来这边。
            answer: Don't stand at the door; come here.
            hint: stand at the door
      - key: come-in-other
        kind: chunk
        type: chunk_substitution
        title: 招呼对方进来坐
        chunk: come in
        chunkMeaning: 进来
        direction: zh_to_en
        items:
          - zh: 进来坐吧。
            answer: Come in and have a seat.
            hint: have a seat
          - zh: 门开着，你进来就行。
            answer: The door is open, so just come in.
            hint: just
          - zh: 请他进来一下。
            answer: Ask him to come in for a minute.
            hint: Ask him to
      - key: come-here-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方叫你过去
        chunk: come here
        chunkMeaning: 过来这里
        direction: en_to_zh
        items:
          - en: Come here for a second. I need your help.
            answer: 过来一下，我需要你帮忙。
            hint: for a second；I need your help
          - en: She came here to say goodbye.
            answer: 她过来是为了道别。
            hint: came here；to say goodbye
          - en: Could you come here when you're free?
            answer: 你有空的时候能过来一下吗？
            hint: when you're free
      - key: come-from
        type: vocab_sentence_building
        title: 问对方从哪里来
        vocabWord: come
        vocabMeaning: 来；来自
        direction: zh_to_en
        patterns:
          - chunk: come from
            items:
              - zh: 你从哪里来的？
