              - zh: 我是从北京来的。
                answer: I come from Beijing.
                hint: from Beijing
              - zh: 这趟火车是下午两点从上海开来的。
                answer: This train came from Shanghai at two in the afternoon.
                hint: came from；at two in the afternoon
          - chunk: come from a family
            items:
              - zh: 她来自一个很小的家庭。
                answer: She comes from a small family.
                hint: comes from
              - zh: 我们都来自同一个地方。
                answer: We all come from the same place.
                hint: the same place
              - zh: 这个习惯来自我的奶奶。
                answer: This habit comes from my grandmother.
                hint: This habit；my grandmother
          - chunk: Where do you come from?
            items:
              - zh: 你是哪里人？
                answer: Where do you come from?
                hint: Where do you
              - zh: 请问，这附近的水果是从哪儿来的？
                answer: Excuse me, where do these fruits come from?
                hint: Excuse me；these fruits
              - zh: 你听出来我是哪里人了吗？
                answer: Did you hear where I come from?
                hint: Did you hear
      - key: come-from-beijing
