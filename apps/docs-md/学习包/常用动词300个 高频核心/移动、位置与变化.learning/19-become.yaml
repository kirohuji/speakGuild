learning:
  exercises:
    pipeline:
      - key: become-difficult
        kind: chunk
        type: chunk_substitution
        title: 说找车位变得很困难
        chunk: become difficult
        chunkMeaning: 变得困难
        direction: zh_to_en
        items:
          - zh: 找停车位变得很困难。
            answer: It became difficult to find a place to park.
            hint: to find a place to park
          - zh: 这两件事要同时做，变得很难。
            answer: Doing both at once has become difficult.
            hint: Doing both at once
          - zh: 用手机就能付款，方便多了。
            answer: Paying with a phone has become easier.
            hint: Paying with a phone
      - key: become-doctor
        kind: chunk
        type: chunk_substitution
        title: 说她成了一名医生
        chunk: become a doctor
        chunkMeaning: 成为一名医生
        direction: zh_to_en
        items:
          - zh: 她成了一名医生。
            answer: She became a doctor.
            hint: became
          - zh: 他最终成了团队的领导者。
            answer: He eventually became the team's leader.
            hint: eventually
          - zh: 你以后想做什么工作？
            answer: What do you want to become?
            hint: What do you want to
      - key: become-difficult-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说变得怎样
        chunk: become clear
        chunkMeaning: 变得清楚
        direction: en_to_zh
        items:
          - en: It became difficult to find a place to park.
            answer: 找停车位变得很困难。
            hint: a place to park
          - en: The reason soon became clear.
            answer: 原因很快就清楚了。
            hint: soon
          - en: The situation became more complicated than we expected.
            answer: 情况变得比我们预想的更复杂。
            hint: more complicated
      - key: become-state
        type: vocab_sentence_building
        title: 说变得清楚、成为可能
        vocabWord: become
        vocabMeaning: 变得；成为
        direction: zh_to_en
        patterns:
          - chunk: become clear
            items:
              - zh: 原因很快就清楚了。
                answer: The reason soon became clear.
                hint: soon
              - zh: 后来我才明白发生了什么。
                answer: It became clear to me later what had happened.
                hint: It became clear to me
              - zh: 情况越来越清楚：我们得换个方法。
                answer: It's becoming clear that we need another approach.
                hint: It's becoming clear that
          - chunk: become possible
            items:
              - zh: 在任何地方工作已经成为可能。
                answer: Working from anywhere has become possible.
                hint: has become
              - zh: 现在线上办事已经可以了。
                answer: It has become possible to do it online now.
                hint: do it online
              - zh: 多亏了新技术，这件事才有可能。
                answer: Thanks to new technology, this has become possible.
                hint: Thanks to
          - chunk: become available
            items:
              - zh: 这些信息后来可以在网上获取。
                answer: The information became available online.
                hint: became available
              - zh: 这款手机下个月就能买到了。
                answer: This phone will become available next month.
                hint: will become available
              - zh: 还有三张票有货了。
                answer: Three more tickets have become available.
                hint: have become available
      - key: become-interested
        kind: chunk
        type: chunk_substitution
        title: 说上学时开始对历史感兴趣
        chunk: become interested in history
        chunkMeaning: 开始对历史感兴趣
        direction: zh_to_en
