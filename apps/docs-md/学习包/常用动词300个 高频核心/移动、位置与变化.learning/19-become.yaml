            answer: 用一段时间就熟悉了。
            hint: It takes time
          - en: I still haven't become familiar with this area.
            answer: 我对这一带还不太熟。
            hint: this area
      - key: become-part-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说成为某事物的一部分
        chunk: become part of
        chunkMeaning: 成为某事物的一部分
        direction: en_to_zh
        items:
          - en: The habit became part of my routine.
            answer: 这个习惯成了我日常生活的一部分。
            hint: my routine
          - en: Running every morning has become part of my routine.
            answer: 每天早上跑步已经成了我的习惯。
            hint: Running every morning
          - en: Work soon became part of his life.
            answer: 工作很快就成了他生活的一部分。
            hint: his life
      - key: become-adjective
        type: pattern_drill
        title: 说变得怎样
        pattern: become [adjective]
        patternMeaning: 变得怎样
        direction: zh_to_en
        items:
          - zh: 情况比我们预想的更复杂。
