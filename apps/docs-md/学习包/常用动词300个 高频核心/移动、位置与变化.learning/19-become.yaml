      - key: become-involved-other
        type: pattern_drill
        title: 说参与别的事
        pattern: become involved in [something]
        patternMeaning: 参与某事
        direction: zh_to_en
        items:
          - zh: 他参与了社区活动。
            answer: He became involved in community events.
