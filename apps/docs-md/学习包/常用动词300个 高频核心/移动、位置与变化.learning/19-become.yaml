            answer: You can become involved in this event, but don't take on too much.
            hint: take on too much
      - key: become-familiar
        kind: chunk
        type: chunk_substitution
        title: 说你很快就会熟悉这个系统
        chunk: become familiar with the system
        chunkMeaning: 熟悉这个系统
        direction: zh_to_en
        items:
          - zh: 你很快就会熟悉这个系统。
            answer: You'll become familiar with the system soon.
            hint: become familiar with
          - zh: 用一段时间就熟悉了。
            answer: It takes time to become familiar with it.
            hint: It takes time
          - zh: 我对这一带还不太熟。
            answer: I still haven't become familiar with this area.
            hint: haven't；this area
      - key: become-part-of
        kind: chunk
        type: chunk_substitution
        title: 说这个习惯成了日常的一部分
        chunk: become part of my routine
        chunkMeaning: 成为我日常的一部分
        direction: zh_to_en
        items:
          - zh: 这个习惯成了我日常生活的一部分。
            answer: The habit became part of my routine.
            hint: became part of
          - zh: 每天早上跑步已经成了我的习惯。
            answer: Running every morning has become part of my routine.
            hint: Running every morning
          - zh: 工作很快就成了他生活的一部分。
            answer: Work soon became part of his life.
            hint: part of his life
      - key: become-familiar-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说熟悉某个系统
        chunk: become familiar with the system
        chunkMeaning: 熟悉这个系统
        direction: en_to_zh
        items:
