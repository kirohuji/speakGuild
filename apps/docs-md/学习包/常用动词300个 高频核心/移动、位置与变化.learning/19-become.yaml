      - key: become-listen
        type: pattern_drill
        title: 听懂对方说变得怎样
        pattern: become [adjective] / become [noun]
        patternMeaning: 变得 / 成为
        direction: en_to_zh
        items:
          - en: He eventually became the team's leader.
            answer: 他最终成了团队的领导者。
            hint: the team's leader
          - en: It has become possible to work from anywhere.
            answer: 在任何地方工作已经成为可能。
            hint: from anywhere
          - en: Everything is becoming more expensive.
            answer: 一切变得越来越贵了。
            hint: more expensive
      - key: become-doctor-build
        type: sentence_decomposition
        title: 把成为医生说完整
        sourceKind: chunk
        sourceText: become a doctor
        fullSentence: She studied hard for years and finally became a doctor.
        fullSentenceZh: 她努力学了很多年，最后成了一名医生。
        levels:
          - level: 1
            label: 核心句
            en: She became a doctor.
            zh: 她成了一名医生。
            highlight: ''
            hint: 先说她成了医生
          - level: 2
            label: 加时间
            en: She finally became a doctor.
            zh: 她最后成了一名医生。
            highlight: finally
            hint: 补上最后
          - level: 3
            label: 完整句
            en: She studied hard for years and finally became a doctor.
            zh: 她努力学了很多年，最后成了一名医生。
            highlight: studied hard for years
            hint: 补上努力学了很多年
      - key: become-clear-build
        type: sentence_decomposition
        title: 把原因变得清楚说完整
        sourceKind: vocab
        sourceText: become
        fullSentence: After we read the report, it became clear what had gone wrong.
        fullSentenceZh: 我们看了报告以后，才明白问题出在哪里。
        levels:
          - level: 1
            label: 核心句
            en: It became clear what had gone wrong.
            zh: 问题出在哪里清楚了。
            highlight: ''
            hint: 先说问题清楚了
          - level: 2
            label: 加条件
            en: After reading the report, it became clear what had gone wrong.
            zh: 看了报告之后，问题出在哪里就清楚了。
            highlight: After reading the report
            hint: 补上看了报告之后
          - level: 3
            label: 完整句
            en: After we read the report, it became clear what had gone wrong.
            zh: 我们看了报告以后，才明白问题出在哪里。
            highlight: what had gone wrong
            hint: 说清楚明白的是什么
