        type: chunk_substitution
        title: 说我逐渐意识到这个问题
        chunk: become aware of the problem
        chunkMeaning: 意识到这个问题
        direction: zh_to_en
        items:
          - zh: 我逐渐意识到了这个问题。
            answer: I gradually became aware of the problem.
            hint: gradually
          - zh: 大家开始意识到问题的严重性。
            answer: People are becoming aware of how serious the problem is.
            hint: how serious the problem is
          - zh: 我们当时没意识到风险。
            answer: We didn't become aware of the risk at the time.
            hint: didn't；at the time
      - key: become-involved
        kind: chunk
