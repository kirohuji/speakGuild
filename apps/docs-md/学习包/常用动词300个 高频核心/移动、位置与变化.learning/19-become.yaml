        direction: zh_to_en
        items:
          - zh: 他的愿望是成为一名老师。
            answer: His dream is to become a teacher.
            hint: His dream is to
          - zh: 她成了这家公司的老板。
            answer: She became the boss of this company.
            hint: the boss
          - zh: 三年后他成了经理。
            answer: Three years later, he became a manager.
            hint: Three years later
