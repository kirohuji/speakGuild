          - zh: 孩子们开始对科学感兴趣了。
            answer: The kids became interested in science.
            hint: science
          - zh: 你什么时候开始对这个感兴趣？
            answer: When did you become interested in this?
            hint: When did
      - key: become-aware-other
        type: pattern_drill
        title: 说意识到别的事
        pattern: become aware of [something]
        patternMeaning: 开始意识到某事
        direction: zh_to_en
        items:
          - zh: 他终于意识到了自己的错误。
            answer: He finally became aware of his mistake.
