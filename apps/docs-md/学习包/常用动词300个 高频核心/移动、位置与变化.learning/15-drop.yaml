          - level: 2
            label: 加地点
            en: I dropped my phone on the floor.
            zh: 我把手机掉在地上。
            highlight: on the floor
            hint: 补上在地上
          - level: 3
            label: 完整句
            en: I dropped my phone on the floor, but luckily the screen didn't break.
            zh: 我把手机掉在地上，幸好屏幕没坏。
            highlight: but luckily the screen didn't break
            hint: 补上幸好屏幕没坏
      - key: drop-percent-build
        type: sentence_decomposition
        title: 把销量下降说完整
        sourceKind: vocab
        sourceText: drop
        fullSentence: Sales dropped by ten percent this quarter, which is worse than we expected.
        fullSentenceZh: 这个季度销量下降了10%，比我们预想的还要糟。
        levels:
          - level: 1
            label: 核心句
            en: Sales dropped by ten percent.
            zh: 销量下降了10%。
            highlight: ''
            hint: 先说下降了10%
          - level: 2
            label: 加时间
            en: Sales dropped by ten percent this quarter.
            zh: 这个季度销量下降了10%。
            highlight: this quarter
            hint: 补上这个季度
          - level: 3
            label: 完整句
            en: Sales dropped by ten percent this quarter, which is worse than we expected.
            zh: 这个季度销量下降了10%，比我们预想的还要糟。
            highlight: which is worse than we expected
            hint: 补上比预想更糟
