          - level: 3
            label: 完整句
            en: Every Sunday night I review my notes and list what I still don't understand.
            zh: 每个周日晚上我复习笔记，列出还没弄懂的地方。
            highlight: what I still don't understand
            hint: 具体说成列出不懂之处