            answer: Scientists reviewed the evidence carefully before concluding.
            hint: carefully；before concluding
          - zh: 律师要求我们重新审查证据。
            answer: The lawyer asked us to review the evidence again.
            hint: again
      - key: review-what-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说回顾什么内容
        chunk: review what
        chunkMeaning: 回顾……什么
        direction: en_to_zh
        items:
          - en: Let's review what we agreed on in the last meeting.
            answer: 咱们回顾一下上次会议达成了什么共识。
            hint: agreed on；last meeting
          - en: She reviewed what went wrong during the rollout.
            answer: 她复盘了发布过程中哪里出了问题。
            hint: went wrong；rollout
          - en: Please review what changed in the new policy.
            answer: 请看一下新政策改了什么。
            hint: changed；new policy
      - key: review-for-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂审阅或复查的目的
        chunk: review for
        chunkMeaning: 为……而审阅
        direction: en_to_zh
        items:
          - en: The committee will review the budget for next year.
            answer: 委员会将审查明年的预算。
            hint: the budget；next year
          - en: I reviewed the code for security issues.
            answer: 我审了代码，查安全问题。
            hint: the code；security issues
          - en: Doctors review scans for signs of injury.
            answer: 医生查看影像，寻找受伤迹象。
            hint: scans；signs of injury
      - key: review-state
        type: vocab_sentence_building
        title: 说复习与审阅
        vocabWord: review
        vocabMeaning: 复习；审查；评论
        direction: zh_to_en
        patterns:
          - chunk: review my notes
            items:
              - zh: 地铁上我会翻翻笔记。
                answer: I review my notes on the subway.
                hint: on the subway
              - zh: 他把笔记复习了三遍。
                answer: He reviewed his notes three times.
                hint: three times
          - chunk: review the plan
            items:
              - zh: 演练前指挥会过一遍方案。
                answer: Command reviews the plan before the drill.
                hint: before the drill
              - zh: 投资者要求再次审查商业计划。
                answer: Investors asked to review the plan again.
                hint: again
          - chunk: review progress
            items:
              - zh: 一对一谈话时回顾项目进展。
                answer: In one-on-ones, we review progress on projects.
                hint: one-on-ones；on projects
              - zh: 家长会上老师向父母汇报学习进展。
                answer: At conferences, teachers review progress with parents.
                hint: with parents
      - key: review-document-other
