            hint: chapter three
      - key: review-plan-build
        type: sentence_decomposition
        title: 把审查计划说完整
        sourceKind: chunk
        sourceText: review the plan
        fullSentence: Before we launch, let's review the plan one more time and confirm everyone knows their role.
        fullSentenceZh: 上线前我们再审查一遍计划，确认人人都清楚自己的分工。
        levels:
          - level: 1
            label: 核心句
            en: Let's review the plan before we launch.
            zh: 上线前我们再审查一遍计划。
            highlight: ''
            hint: 先说上线前审查计划
          - level: 2
            label: 加次数
            en: Let's review the plan one more time before we launch.
            zh: 上线前我们再审查一遍计划。
            highlight: one more time
            hint: 再强调一遍
          - level: 3
            label: 完整句
            en: Before we launch, let's review the plan one more time and confirm everyone knows their role.
            zh: 上线前我们再审查一遍计划，确认人人都清楚自己的分工。
            highlight: confirm everyone knows their role
            hint: 补上确认分工
      - key: review-notes-build
        type: sentence_decomposition
        title: 把复习笔记说完整
        sourceKind: chunk
        sourceText: review my notes
        fullSentence: Every Sunday night I review my notes and list what I still don't understand.
        fullSentenceZh: 每个周日晚上我复习笔记，列出还没弄懂的地方。
        levels:
          - level: 1
            label: 核心句
            en: Every Sunday night I review my notes.
            zh: 每个周日晚上我复习笔记。
            highlight: ''
            hint: 先说周日晚上复习笔记
          - level: 2
