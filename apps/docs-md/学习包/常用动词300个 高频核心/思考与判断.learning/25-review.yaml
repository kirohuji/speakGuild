            answer: HR helps teams review performance.
            hint: HR helps
          - zh: 我们每季度回顾一次业绩。
            answer: We review performance every quarter.
            hint: every quarter
      - key: review-a-draft
        kind: chunk
        type: chunk_substitution
        title: 说审阅草稿
        chunk: review a draft
        chunkMeaning: 审阅草稿
        direction: zh_to_en
        items:
          - zh: 能帮我看看稿子吗？
            answer: Can you review a draft for me?
            hint: for me
          - zh: 编辑连夜审了草稿。
            answer: The editor reviewed a draft overnight.
            hint: overnight
          - zh: 发客户前请先审阅草稿。
            answer: Review a draft before you send it to the client.
            hint: before you send it
      - key: review-the-evidence
        kind: chunk
        type: chunk_substitution
        title: 说审查证据
        chunk: review the evidence
        chunkMeaning: 审查证据
        direction: zh_to_en
        items:
          - zh: 陪审团需要审查证据。
            answer: The jury needs to review the evidence.
            hint: The jury needs to
