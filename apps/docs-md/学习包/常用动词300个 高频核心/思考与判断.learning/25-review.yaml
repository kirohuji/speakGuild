            answer: I review new laptops online before I buy a computer.
            hint: online；before I buy
          - zh: 杂志这期评测了几款新笔记本。
            answer: The magazine reviewed new laptops in this issue.
            hint: in this issue
      - key: review-regularly
        kind: chunk
        type: chunk_substitution
        title: 说定期回顾
        chunk: review regularly
        chunkMeaning: 定期复查/回顾
        direction: zh_to_en
        items:
