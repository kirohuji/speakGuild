            answer: The mentor reviews progress with students each month.
            hint: with students；each month
          - zh: 项目经理向客户汇报并回顾进展。
            answer: The PM updates the client and reviews progress.
            hint: updates the client
      - key: review-performance
        kind: chunk
        type: chunk_substitution
        title: 说评估绩效
        chunk: review performance
        chunkMeaning: 评估表现
        direction: zh_to_en
        items:
          - zh: 年底老板会评估员工表现。
            answer: At year end, managers review performance.
            hint: At year end；managers
