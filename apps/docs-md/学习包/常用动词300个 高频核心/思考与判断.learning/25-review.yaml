learning:
  exercises:
    pipeline:
      - key: review-my-notes
        kind: chunk
        type: chunk_substitution
        title: 说复习笔记
        chunk: review my notes
        chunkMeaning: 复习我的笔记
        direction: zh_to_en
        items:
          - zh: 睡前我会过一遍笔记。
            answer: I review my notes before bed.
            hint: before bed
          - zh: 考试前她把笔记又看了一遍。
            answer: She reviewed her notes before the test.
            hint: before the test
          - zh: 你复习笔记时标出重点了吗？
            answer: Did you review your notes and mark the key points?
            hint: mark the key points
      - key: review-this-document
        kind: chunk
        type: chunk_substitution
        title: 说审阅这份文件
        chunk: review this document
        chunkMeaning: 审阅这份文件
        direction: zh_to_en
        items:
          - zh: 请抽空审阅这份文件。
            answer: Please review this document when you have time.
            hint: when you have time
          - zh: 法务正在审阅这份文件。
            answer: Legal is reviewing this document.
            hint: Legal is
          - zh: 你审过这份文件了吗？
            answer: Have you reviewed this document?
            hint: Have you
      - key: review-the-plan
        kind: chunk
        type: chunk_substitution
        title: 说审查计划
        chunk: review the plan
        chunkMeaning: 审查计划
        direction: zh_to_en
        items:
          - zh: 下周董事会要审查计划。
            answer: The board will review the plan next week.
            hint: next week
          - zh: 执行前我们再审查一遍计划。
            answer: Let's review the plan once more before we execute it.
            hint: once more；before we execute it
          - zh: 经理已经审查过年度计划了。
            answer: The manager has already reviewed the plan.
            hint: has already
      - key: review-what-happened-yesterday
        kind: chunk
        type: chunk_substitution
        title: 说复盘昨天的事
        chunk: review what happened yesterday
        chunkMeaning: 回顾昨天发生了什么
        direction: zh_to_en
        items:
          - zh: 晨会我们先复盘昨天的情况。
            answer: In the morning meeting, we review what happened yesterday.
            hint: In the morning meeting
          - zh: 教练让球队复盘昨天的比赛。
            answer: The coach asked the team to review what happened yesterday.
            hint: The coach asked
          - zh: 写日记有助于回顾昨天发生的事。
            answer: Journaling helps you review what happened yesterday.
            hint: Journaling helps
      - key: review-new-laptops
        kind: chunk
        type: chunk_substitution
        title: 说评测新笔记本
        chunk: review new laptops
        chunkMeaning: 评测新款笔记本电脑
        direction: zh_to_en
        items:
          - zh: 他的频道专门评测新笔记本。
            answer: His channel reviews new laptops.
            hint: His channel
