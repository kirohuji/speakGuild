        type: chunk_substitution
        title: 说总体来看还算可以
        chunk: all things considered
        chunkMeaning: 总体来看；综合考虑
        direction: zh_to_en
        items:
          - zh: 总体来看，这次项目还算成功。
            answer: All things considered, the project went pretty well.
            hint: the project went pretty well
