            answer: She never carefully considered the consequences.
            hint: never；carefully considered
      - key: consider-the-possibility
        kind: chunk
        type: chunk_substitution
        title: 说考虑某种可能
        chunk: consider the possibility
        chunkMeaning: 考虑这种可能
        direction: zh_to_en
        items:
          - zh: 我们也要考虑这种可能。
            answer: We should also consider the possibility.
            hint: We should also
          - zh: 你有没有考虑过这种可能？
