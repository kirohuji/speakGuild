            answer: All things considered, he did a good job.
            hint: he did a good job
          - zh: 出了点岔子，但总体看还不坏。
            answer: Things went wrong, but all things considered, it's not bad.
            hint: Things went wrong；it's not bad
      - key: considered-to-be-very-safe
        kind: chunk
        type: chunk_substitution
        title: 说被认为很安全
        chunk: considered to be very safe
        chunkMeaning: 被认为很安全
        direction: zh_to_en
        items:
          - zh: 这个地区被认为很安全。
            answer: This area is considered to be very safe.
            hint: This area is；is considered
          - zh: 这种药长期被认为很安全。
            answer: This medicine has long been considered to be very safe.
            hint: has long been
          - zh: 新线路被认为非常安全。
            answer: The new route is considered to be very safe.
            hint: The new route is
      - key: worth-considering
        kind: chunk
        type: chunk_substitution
        title: 说值得考虑
        chunk: worth considering
        chunkMeaning: 值得考虑
        direction: zh_to_en
        items:
          - zh: 这个建议值得考虑。
