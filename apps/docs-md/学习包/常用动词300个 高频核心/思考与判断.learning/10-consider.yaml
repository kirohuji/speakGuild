            hint: Before approval；the committee
      - key: carefully-consider-consequences
        kind: chunk
        type: chunk_substitution
        title: 说要慎重考虑后果
        chunk: carefully consider the consequences
        chunkMeaning: 慎重考虑后果
        direction: zh_to_en
        items:
          - zh: 签字前要慎重考虑后果。
