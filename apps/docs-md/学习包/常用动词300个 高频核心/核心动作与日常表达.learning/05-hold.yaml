learning:
  exercises:
    pipeline:
      - key: hold-the-box
        kind: chunk
        type: chunk_substitution
        title: 请人帮忙拿一下东西
        chunk: hold the box
        chunkMeaning: 拿一下这个箱子
        direction: zh_to_en
        items:
          - zh: 你能帮我拿一下这个箱子吗？
            answer: Can you hold this box for a second?
            hint: for a second
          - zh: 你拿一下伞，我去开车门。
            answer: Hold the umbrella while I unlock the car.
            hint: the umbrella；unlock the car
          - zh: 他一手拿托盘，一手拿钥匙。
            answer: He was holding a tray in one hand and his keys in the other.
            hint: a tray；his keys
      - key: hold-the-box-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方请你帮忙拿东西
        chunk: hold the box
        chunkMeaning: 拿一下这个箱子
        direction: en_to_zh
        items:
          - en: Could you hold this box while I open the door?
            answer: 我开门的时候你能帮我拿一下这个箱子吗？
            hint: while I open the door
          - en: She held the tray while I set the table.
            answer: 我摆桌子的时候她帮我拿着托盘。
            hint: the tray；set the table
          - en: Hold the bag for a moment, please.
            answer: 请帮我拿一下包。
            hint: the bag
      - key: hold-door-open
        kind: chunk
        type: chunk_substitution
        title: 请人帮忙扶门
        chunk: hold the door open
        chunkMeaning: 扶着门让它开着
        direction: zh_to_en
        items:
          - zh: 你能帮我把门扶着吗？
            answer: Can you hold the door open for me?
            hint: for me
          - zh: 他扶着电梯门，等大家出来。
            answer: He held the lift door open until everyone got out.
            hint: the lift door；got out
          - zh: 她帮我扶着门，我抱着箱子进来。
            answer: She held the door for me while I carried the boxes in.
            hint: carried the boxes in
      - key: hold-on
        kind: chunk
        type: chunk_substitution
        title: 请对方稍等
        chunk: Hold on.
        chunkMeaning: 等一下
        direction: zh_to_en
        items:
          - zh: 等一下，我查一下日程。
            answer: Hold on, let me check my schedule.
            hint: let me check；my schedule
          - zh: 稍等，我找支笔记一下。
            answer: Hold on a second; I need to grab a pen.
            hint: grab a pen
          - zh: 你先别挂，我去叫经理。
            answer: Hold on; I'll get the manager.
            hint: get the manager
      - key: hold-on-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方叫你等一下
        chunk: hold on
        chunkMeaning: 等一下
        direction: en_to_zh
        items:
          - en: Hold on, I'll be back in a minute.
            answer: 等一下，我一分钟就回来。
            hint: in a minute
          - en: Hold on, the lift is coming.
            answer: 等一下，电梯来了。
            hint: the lift
          - en: Hold on; let me find your file.
            answer: 等一下，我找一下你的文件。
            hint: find your file
      - key: hold-back-tears
        kind: chunk
        type: chunk_substitution
        title: 说忍住情绪
        chunk: hold back my tears
        chunkMeaning: 忍住眼泪
        direction: zh_to_en
        items:
          - zh: 开会时我努力忍住眼泪。
            answer: I tried to hold back my tears during the meeting.
            hint: during the meeting
          - zh: 听到这个消息，她忍不住哭了。
            answer: She couldn't hold back her tears when she heard the news.
            hint: when；the news
          - zh: 他咬住嘴唇，忍住笑。
            answer: He held back his laughter by biting his lip.
            hint: by biting his lip
      - key: hold-meeting
        kind: chunk
        type: chunk_substitution
        title: 说举行会议或活动
        chunk: hold a meeting
        chunkMeaning: 开一次会
        direction: zh_to_en
        items:
          - zh: 我们明天上午要开会。
            answer: We're holding a meeting tomorrow morning.
            hint: tomorrow morning
          - zh: 婚礼将在花园里举行。
            answer: The wedding will be held in the garden.
            hint: The wedding；in the garden
          - zh: 公司每年办一次招聘会。
            answer: The company holds a job fair every year.
            hint: a job fair；every year
      - key: hold-position
        kind: chunk
        type: chunk_substitution
        title: 说担任某个职位
        chunk: hold the position
        chunkMeaning: 担任这个职位
        direction: zh_to_en
        items:
          - zh: 她担任这个职位已经三年了。
            answer: She has held the position for three years.
            hint: for three years
          - zh: 他当过两届会长。
            answer: He held the post of chairman for two terms.
            hint: the post of chairman；two terms
          - zh: 这个职位她还能担任多久？
            answer: How long can she hold this position?
            hint: How long
      - key: hold-object
        type: pattern_drill
        title: 说手里拿着什么
        pattern: hold [something]
        patternMeaning: 握住、拿住某物
        direction: zh_to_en
        items:
          - zh: 你能帮我拿一下这个吗？
            answer: Can you hold this for a second?
            hint: for a second
          - zh: 她抱着孩子站在门口。
            answer: She was holding her baby at the door.
            hint: her baby
          - zh: 扶好梯子，我上去看看。
            answer: Hold the ladder steady while I climb up.
            hint: the ladder；climb up
      - key: hold-object-state
        type: pattern_drill
        title: 说扶住某物让它保持状态
        pattern: hold [something] [adjective]
        patternMeaning: 扶住某物，使其保持某种状态
        direction: zh_to_en
        items:
          - zh: 帮我扶一下门，别让它关上。
            answer: Hold the door open for me.
            hint: for me
          - zh: 请把杯子拿稳。
            answer: Please hold the glass steady.
            hint: steady
          - zh: 她一直抬着头，很认真地听。
            answer: She held her head up and listened carefully.
            hint: her head up；carefully
      - key: hold-event
        type: pattern_drill
        title: 说什么时候举行活动
        pattern: hold a [meeting/event]
        patternMeaning: 举行会议或活动
        direction: zh_to_en
        items:
          - zh: 我们每个季度开一次全体会。
            answer: We hold a company meeting every quarter.
            hint: every quarter
          - zh: 活动是在室内还是室外举行？
            answer: Will the event be held indoors or outdoors?
            hint: indoors or outdoors
          - zh: 毕业典礼在礼堂举行。
            answer: The graduation ceremony will be held in the hall.
            hint: graduation ceremony；in the hall
      - key: hold-position-other
        type: pattern_drill
        title: 说谁担任某个职位
        pattern: hold [a position]
        patternMeaning: 担任某个职位
        direction: zh_to_en
        items:
          - zh: 他在公司担任经理一职十年。
            answer: He held a manager position at the company for ten years.
            hint: a manager position；ten years
          - zh: 谁担任这个职位？
            answer: Who holds this position?
            hint: Who
          - zh: 她在董事会担任重要职务。
            answer: She holds an important position on the board.
            hint: an important position；on the board
      - key: hold-back-other
        type: pattern_drill
        title: 说忍住别的东西
        pattern: hold back [something]
        patternMeaning: 抑制、忍住
        direction: zh_to_en
        items:
          - zh: 我没能忍住笑。
            answer: I couldn't hold back my laughter.
            hint: laughter
          - zh: 她努力压住自己的怒气。
            answer: She tried hard to hold back her anger.
            hint: tried hard；her anger
          - zh: 别把好消息瞒着我。
            answer: Don't hold back the good news from me.
            hint: the good news；from me
      - key: hold-attention-responsibility
        type: vocab_sentence_building
        title: 说吸引注意力，或认为谁该负责
        vocabWord: hold
        vocabMeaning: 持续吸引注意；认为某人应负责
        direction: zh_to_en
        patterns:
          - chunk: hold my attention
            items:
              - zh: 这部电影让我从头到尾看得很投入。
                answer: The movie held my attention from beginning to end.
                hint: from beginning to end
              - zh: 他的演讲没能让听众一直听下去。
                answer: His talk didn't hold the audience's attention.
                hint: the audience's attention
          - chunk: hold him responsible for
            items:
              - zh: 他们认为他应对这次失败负责。
                answer: They held him responsible for the failure.
                hint: the failure
              - zh: 别把所有问题都怪到她头上。
                answer: Don't hold her responsible for all the problems.
                hint: all the problems
      - key: hold-onto-hold-up
        type: vocab_sentence_building
        title: 说留着东西，或被事情耽搁
        vocabWord: hold
        vocabMeaning: 留着；耽搁
        direction: zh_to_en
        patterns:
          - chunk: hold onto the receipt
            items:
              - zh: 把收据留好，退货的时候要用。
                answer: Hold onto the receipt; you'll need it if you return the item.
                hint: return the item
              - zh: 这些文件先留着，稍后还要用。
                answer: Hold onto these papers; we'll need them later.
                hint: we'll need them later
          - chunk: hold me up
            items:
              - zh: 堵车耽搁了我半个小时。
                answer: Traffic held me up for half an hour.
                hint: Traffic；half an hour
              - zh: 抱歉让你等，我被一个电话耽搁了。
                answer: Sorry to hold you up; I got caught on a call.
                hint: caught on a call
      - key: hold-door-open-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说帮忙扶门
        chunk: hold the door open
        chunkMeaning: 扶着门让它开着
        direction: en_to_zh
        items:
          - en: Could you hold the door open for me?
            answer: 你能帮我把门扶着吗？
            hint: for me
          - en: He held the lift door open until everyone got out.
            answer: 他扶着电梯门，等大家都出来。
            hint: the lift door；got out
          - en: I'll hold the door open while you carry the bags.
            answer: 你搬袋子的时候，我帮你扶着门。
            hint: carry the bags
      - key: hold-back-tears-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说忍住情绪
        chunk: hold back my tears
        chunkMeaning: 忍住眼泪
        direction: en_to_zh
        items:
          - en: I tried to hold back my tears during the meeting.
            answer: 开会时我努力忍住眼泪。
            hint: during the meeting
          - en: She couldn't hold back her tears when she heard the news.
            answer: 听到这个消息，她忍不住哭了。
            hint: when；the news
          - en: He held back his anger and said nothing.
            answer: 他压住怒气，什么也没说。
            hint: his anger；said nothing
      - key: hold-object-state-listen
        type: pattern_drill
        title: 听懂对方说扶住某物
        pattern: hold [something] [adjective]
        patternMeaning: 扶住某物，使其保持某种状态
        direction: en_to_zh
        items:
          - en: Hold the door open for the next person.
            answer: 帮下一个人扶着门。
            hint: the next person
          - en: She held the glass steady while she poured the water.
            answer: 倒水的时候她把杯子拿得很稳。
            hint: while；poured the water
          - en: Keep holding your head up and breathe slowly.
            answer: 继续抬着头，慢慢呼吸。
            hint: breathe slowly
      - key: hold-back-build
        type: sentence_decomposition
        title: 把忍住眼泪这件事说完整
        sourceKind: chunk
        sourceText: hold back my tears
        fullSentence: She took a deep breath to hold back her tears during the meeting.
        fullSentenceZh: 她深吸一口气，在开会时忍住了眼泪。
        levels:
          - level: 1
            label: 核心句
            en: She held back her tears.
            zh: 她忍住了眼泪。
            highlight: ''
            hint: 先说她忍住了眼泪
          - level: 2
            label: 加时间
            en: She held back her tears during the meeting.
            zh: 她在开会时忍住了眼泪。
            highlight: during the meeting
            hint: 补上在开会时
          - level: 3
            label: 完整句
            en: She took a deep breath to hold back her tears during the meeting.
            zh: 她深吸一口气，在开会时忍住了眼泪。
            highlight: took a deep breath to
            hint: 补上深吸一口气
      - key: hold-door-build
        type: sentence_decomposition
        title: 把帮着扶门这件事说完整
        sourceKind: chunk
        sourceText: hold the door open
        fullSentence: He held the door open for me while I carried the boxes in.
        fullSentenceZh: 我搬箱子进来的时候，他帮我扶着门。
        levels:
          - level: 1
            label: 核心句
            en: He held the door open.
            zh: 他扶着门。
            highlight: ''
            hint: 先说他扶着门
          - level: 2
            label: 加对象
            en: He held the door open for me.
            zh: 他帮我扶着门。
            highlight: for me
            hint: 补上帮我
          - level: 3
            label: 完整句
            en: He held the door open for me while I carried the boxes in.
            zh: 我搬箱子进来的时候，他帮我扶着门。
            highlight: while I carried the boxes in
            hint: 补上我搬箱子进来的时候
