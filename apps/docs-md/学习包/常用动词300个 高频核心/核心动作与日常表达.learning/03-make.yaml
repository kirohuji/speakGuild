learning:
  exercises:
    pipeline:
      - key: make-for-someone
        type: pattern_drill
        title: 为某人做或准备一样东西
        pattern: make [something] for [someone]
        patternMeaning: 为某人制作或准备某物
        direction: zh_to_en
        items:
          - zh: 她昨晚给我们做了晚饭，因为我们都加班到很晚。
            answer: She made dinner for us last night because we all worked late.
            hint: last night；because；worked late
          - zh: 你能在中午前给客户复印一份吗？
            answer: Can you make a copy for the client before noon?
            hint: a copy；the client；before noon
          - zh: 谁还在忙，我就给谁煮咖啡。
            answer: I'll make coffee for anyone who's still working.
            hint: coffee；anyone；still working
      - key: make-me-laugh
        kind: chunk
        type: chunk_substitution
        title: 说什么把我逗笑了
        chunk: make me laugh
        chunkMeaning: 让我笑出来
        direction: zh_to_en
        items:
          - zh: 那个笑话让我笑了。
            answer: That joke made me laugh.
            hint: That joke
          - zh: 我没心情的时候，别想逗我笑。
            answer: Don't try to make me laugh when I'm not in the mood.
            hint: Don't try；when；not in the mood
          - zh: 这个笑话总能让我笑。
            answer: This joke always makes me laugh.
            hint: always
      - key: make-it-say
        kind: chunk
        type: chunk_substitution
        title: 说自己来不了，或问对方来不来
        chunk: make it
        chunkMeaning: 赶到；来得了；出席
        direction: zh_to_en
        items:
          - zh: 火车要是晚点，我就赶不上晚饭了。
            answer: If the train is late, I can't make it to dinner.
            hint: If；the train；dinner
          - zh: 你明天的面试来得了吗？
            answer: Can you make it to the interview tomorrow?
            hint: the interview；tomorrow
          - zh: 我今晚可能来不了。
            answer: I might not be able to make it tonight.
            hint: might not；tonight
      - key: make-it-attend
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说来不了
        chunk: make it
        chunkMeaning: 赶到；来得了；出席
        direction: en_to_zh
        items:
          - en: I don't think I can make it tonight.
            answer: 我觉得今晚我来不了。
            hint: don't think；tonight
          - en: Can you make it to the meeting at four?
            answer: 你能赶上四点的会吗？
            hint: the meeting；at four
          - en: I don't think I can make it to dinner tonight.
            answer: 我觉得今晚的晚饭我来不了。
            hint: tonight
      - key: make-sense-say
        kind: chunk
        type: chunk_substitution
        title: 说一件事讲不讲得通
        chunk: make sense
        chunkMeaning: 说得通；有道理
        direction: zh_to_en
        items:
          - zh: 你这个安排我觉得说得通。
            answer: Your plan makes sense to me.
            hint: Your plan；to me
          - zh: 他突然改了主意，这说不通。
            answer: His sudden change of mind doesn't make sense.
            hint: sudden；change of mind
          - zh: 这个计划从长远看是有道理的。
            answer: The plan makes sense in the long run.
            hint: in the long run
      - key: make-sense-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说这讲不讲得通
        chunk: That makes sense.
        chunkMeaning: 这说得通
        direction: en_to_zh
        items:
          - en: That makes sense to me now.
            answer: 我现在觉得这说得通了。
            hint: to me；now
          - en: That explanation doesn't make sense to me.
            answer: 那个解释对我来说说不通。
            hint: explanation；doesn't；to me
          - en: Your plan makes sense to me.
            answer: 我觉得你的计划说得通。
            hint: Your plan
      - key: make-someone-do
        type: pattern_drill
        title: 让某人做一件事
        pattern: make [someone] [do]
        patternMeaning: 使某人做某事；后面的动词用原形，不加 to
        direction: zh_to_en
        items:
          - zh: 老师让我们把那篇文章重写了。
            answer: The teacher made us rewrite the essay.
            hint: The teacher；the essay
          - zh: 警报声让所有人停下了手里的事。
            answer: The alarm made everyone stop what they were doing.
            hint: The alarm；everyone
          - zh: 谁也没能让他道歉。
            answer: Nobody could make him apologize.
            hint: Nobody；could
      - key: make-passive-say
        type: pattern_drill
        title: 说自己被迫做了什么
        pattern: be made to [do]
        patternMeaning: 被迫做某事；这里要说出 to
        direction: zh_to_en
        items:
          - zh: 我被迫在走廊等了十分钟。
            answer: I was made to wait in the corridor for ten minutes.
            hint: the corridor；ten minutes
          - zh: 我们被迫把结论全部重写了。
            answer: We were made to rewrite the conclusion completely.
            hint: the conclusion；completely
          - zh: 我们被迫等了两个小时。
            answer: We were made to wait for two hours.
            hint: two hours
      - key: make-passive-listen
        type: pattern_drill
        title: 听懂对方说被迫做了什么
        pattern: be made to [do]
        patternMeaning: 被迫做某事；被动时动词前要加 to
        direction: en_to_zh
        items:
          - en: I was made to wait outside.
            answer: 我被迫在外面等着。
            hint: outside
          - en: The students were made to rewrite the essay.
            answer: 学生们被迫把那篇文章重写了。
            hint: The students；the essay
          - en: I was made to wait outside for ten minutes.
            answer: 我被迫在外面等了十分钟。
            hint: outside；ten minutes
      - key: make-result-states
        type: vocab_sentence_building
        title: 说造成了什么状态
        vocabWord: make
        vocabMeaning: 使某人或某物变成某种状态
        direction: zh_to_en
        patterns:
          - chunk: make me nervous
            items:
              - zh: 公开演讲总是让我紧张。
                answer: Speaking in public always makes me nervous.
                hint: Speaking in public；always
              - zh: 你刚才看我的样子让我有点紧张。
                answer: The way you looked at me made me a little nervous.
                hint: The way；a little
          - chunk: make the room brighter
            items:
              - zh: 这个设计让房间更亮。
                answer: The design makes the room brighter.
                hint: The design
              - zh: 把灯打开并没有让房间更亮。
                answer: Turning on the light didn't make the room brighter.
                hint: Turning on the light；didn't
      - key: make-role
        type: pattern_drill
        title: 说让某人担任某个角色
        pattern: make [someone] [noun]
        patternMeaning: 使某人成为某种身份；后面接名词，不加 to
        direction: zh_to_en
        items:
          - zh: 他们赛后让他当了队长。
            answer: They made him captain after the match.
            hint: after the match
          - zh: 全班让她当了组长，而不是让他当。
            answer: The class made her the group leader instead of him.
            hint: The class；instead of him
          - zh: 他们让他当了队长。
            answer: They made him captain.
            hint: captain
      - key: make-it-easier
        type: pattern_drill
        title: 说做某事变得更容易或更难
        pattern: make it [adjective] to [do]
        patternMeaning: 使做某事变得……；it 指代后面的 to do，不是“来得了”
        direction: zh_to_en
        items:
          - zh: 这个应用让学英语变得更容易。
            answer: This app makes it easier to learn English.
            hint: This app
          - zh: 这份清单让我们有可能按时做完。
            answer: This checklist makes it possible for us to finish on time.
            hint: This checklist；for us；on time
          - zh: 这儿的噪音让你更难集中注意力吗？
            answer: Does the noise here make it harder for you to concentrate?
            hint: here；for you
      - key: make-decision-mind
        type: vocab_sentence_building
        title: 说还没决定，或已经拿定主意
        vocabWord: make
        vocabMeaning: 做出决定，或下定决心
        direction: zh_to_en
        patterns:
          - chunk: make a decision
            items:
              - zh: 两个方案里我还没选定。
                answer: I haven't made a decision between the two options.
                hint: between；the two options
              - zh: 我们得在周五之前做决定。
                answer: We have to make a decision before Friday.
                hint: have to；before Friday
          - chunk: make up one's mind
            items:
              - zh: 我终于下定决心了。
                answer: I've finally made up my mind.
                hint: finally
              - zh: 这件事你得自己拿定主意。
                answer: You have to make up your own mind about this.
                hint: have to；about this
      - key: make-mistake-progress
        type: vocab_sentence_building
        title: 说一次具体的错，以及它和进步的关系
        vocabWord: make
        vocabMeaning: 犯错，或在犯错之后仍在进步
        direction: zh_to_en
        patterns:
          - chunk: make a mistake
            items:
              - zh: 我把她的名字搞错了。
                answer: I made a mistake with her name.
                hint: her name
              - zh: 出错了就改掉。
                answer: If you make a mistake, just correct it.
                hint: If；just
          - chunk: make progress
            items:
              - zh: 她的写作这一个月进步很大。
                answer: She's made a lot of progress with her writing this month.
                hint: her writing；this month
              - zh: 这些错误就是进步的一部分。
                answer: These mistakes are part of making progress.
                hint: These mistakes
      - key: make-effort
        kind: chunk
        type: chunk_substitution
        title: 说某人在哪件事上真下了功夫
        chunk: make an effort
        chunkMeaning: 付出努力；下功夫
        direction: zh_to_en
        items:
          - zh: 他今天努力在会上发了言。
            answer: He made an effort to speak up in the meeting today.
            hint: speak up；the meeting；today
          - zh: 你要是想赶上，发音上得再多努点力。
            answer: You need to make more of an effort with your pronunciation if you want to catch up.
            hint: your pronunciation；if；catch up
          - zh: 她在会上努力发言了。
            answer: She made an effort to speak up at the meeting.
            hint: speak up；at the meeting
      - key: make-sure
        type: pattern_drill
        title: 提醒对方确认一件事
        pattern: make sure [clause]
        patternMeaning: 确认、确保后面那件事
        direction: zh_to_en
        items:
          - zh: 确认门已经锁好。
            answer: Make sure the door is locked.
            hint: the door；locked
          - zh: 离开之前确认你保存了文件。
            answer: Make sure you save the file before you leave.
            hint: the file；before you leave
          - zh: 你确认她收到邀请了吗？
            answer: Did you make sure she got the invitation?
            hint: Did you；the invitation
      - key: make-sure-listen
        type: pattern_drill
        title: 听懂对方提醒你确认
        pattern: make sure [clause]
        patternMeaning: 确认、确保后面那件事
        direction: en_to_zh
        items:
          - en: Make sure everyone has the new address.
            answer: 确认每个人都有新地址。
            hint: everyone；the new address
          - en: Did you make sure the windows were closed?
            answer: 你确认窗户关上了吗？
            hint: Did you；the windows
          - en: Make sure you save the file before you leave.
            answer: 离开前确认你保存了文件。
            hint: save the file；before you leave
      - key: make-money
        kind: chunk
        type: chunk_substitution
        title: 说赚没赚到钱
        chunk: make money
        chunkMeaning: 赚钱
        direction: zh_to_en
        items:
          - zh: 这家小店开了三个月，还不怎么赚钱。
            answer: This little shop has been open for three months and still isn't making much money.
            hint: three months；still；much
          - zh: 他靠周末修电脑赚钱。
            answer: He makes money by fixing computers on weekends.
            hint: fixing computers；on weekends
          - zh: 他靠教英语赚外快。
            answer: He makes extra money by teaching English.
            hint: extra money；teaching English
      - key: make-difference
        kind: chunk
        type: chunk_substitution
        title: 说什么会带来改变
        chunk: make a difference
        chunkMeaning: 产生影响；带来改变
        direction: zh_to_en
        items:
          - zh: 每天大声读一个例句，可能会对你的口语有很大影响。
            answer: Reading an example out loud every day could make a big difference to your speaking.
            hint: out loud；every day；your speaking
          - zh: 你昨天的那处修改真的起了作用。
            answer: The change you made yesterday really made a difference.
            hint: The change；yesterday；really
          - zh: 每天读一个例句会对你的口语有帮助。
            answer: Reading one example a day can make a difference to your speaking.
            hint: one example a day；your speaking
      - key: make-for-someone-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说为谁做了什么
        chunk: make dinner for us
        chunkMeaning: 给我们做了晚饭
        direction: en_to_zh
        items:
          - en: She made dinner for us last night.
            answer: 她昨晚给我们做了晚饭。
            hint: last night
          - en: Can you make a copy for the client before noon?
            answer: 你能在中午前给客户复印一份吗？
            hint: a copy；the client；before noon
          - en: I'll make coffee for anyone who's still working.
            answer: 谁还在忙，我就给谁煮咖啡。
            hint: anyone；still working
      - key: make-role-listen
        type: pattern_drill
        title: 听懂对方说让谁担任什么角色
        pattern: make [someone] [noun]
        patternMeaning: 使某人成为某种身份
        direction: en_to_zh
        items:
          - en: They made him captain after the match.
            answer: 他们赛后让他当了队长。
            hint: after the match
          - en: The class made her the group leader instead of him.
            answer: 全班让她当了组长，而不是让他当。
            hint: instead of him
          - en: They made her the head of the department.
            answer: 他们让她当了部门主管。
            hint: the head of the department
      - key: make-money-listen
        kind: chunk
        type: chunk_substitution
        title: 听懂对方说赚不赚钱
        chunk: make money
        chunkMeaning: 赚钱
        direction: en_to_zh
        items:
          - en: This little shop still isn't making much money.
            answer: 这家小店还不怎么赚钱。
            hint: still；much
          - en: He makes money by fixing computers on weekends.
            answer: 他靠周末修电脑赚钱。
            hint: fixing computers；on weekends
          - en: They made money from the new product.
            answer: 他们靠新产品赚了钱。
            hint: the new product
      - key: make-object-adjective
        type: pattern_drill
        title: 说让某个人或东西变成什么样
        pattern: make [someone/something] [adjective]
        patternMeaning: 使某人或某物变成某种状态
        direction: zh_to_en
        items:
          - zh: 这个消息让大家很兴奋。
            answer: The news made everyone excited.
            hint: The news；excited
          - zh: 你的解释让我更糊涂了。
            answer: Your explanation made me even more confused.
            hint: even more confused
          - zh: 你这个样子让我更担心了。
            answer: You're making me more worried.
            hint: more worried
      - key: make-decision
        type: pattern_drill
        title: 说做个决定
        pattern: make a decision
        patternMeaning: 作出决定
        direction: zh_to_en
        items:
          - zh: 我们今晚就得定下来。
            answer: We need to make a decision tonight.
            hint: tonight
          - zh: 决定之前，我们先看看数据。
            answer: Let's look at the data before we make a decision.
            hint: look at the data；before
          - zh: 这个决定是我自己做的。
            answer: I made this decision myself.
            hint: myself
      - key: make-progress
        type: pattern_drill
        title: 说在哪方面有进步
        pattern: make progress
        patternMeaning: 取得进展
        direction: zh_to_en
        items:
          - zh: 我们已经在这个项目上取得了一些进展。
            answer: We've made some progress on this project.
            hint: on this project
          - zh: 你在发音上进步了。
            answer: You're making progress with your pronunciation.
            hint: with your pronunciation
          - zh: 只要每天练，就会有进步。
            answer: You'll make progress if you practise every day.
            hint: practise every day
      - key: make-him-captain
        kind: chunk
        type: chunk_substitution
        title: 说让某人当了队长
        chunk: make him captain
        chunkMeaning: 让他当队长
        direction: zh_to_en
        items:
          - zh: 教练让他当了队长。
            answer: The coach made him captain.
            hint: The coach
          - zh: 我们没想到他们会让他当队长。
            answer: We didn't expect them to make him captain.
            hint: didn't expect
          - zh: 他们为什么让他当了队长？
            answer: Why did they make him captain?
            hint: Why
      - key: make-it-easier-english
        kind: chunk
        type: chunk_substitution
        title: 说让学英语变得更容易
        chunk: make it easier to learn English
        chunkMeaning: 让学英语变得更容易
        direction: zh_to_en
        items:
          - zh: 每天读一点会让学英语变得更容易。
            answer: Reading a little every day makes it easier to learn English.
            hint: every day
          - zh: 这些练习让学英语变得更容易了吗？
            answer: Do these exercises make it easier to learn English?
            hint: Do these exercises
          - zh: 有个好老师会让学英语变得更容易。
            answer: A good teacher makes it easier to learn English.
            hint: A good teacher
      - key: make-effort-build
        type: sentence_decomposition
        title: 把努力在会上发言这件事说完整
        sourceKind: chunk
        sourceText: make an effort
        fullSentence: He made an effort to speak up in the meeting, even though he was nervous.
        fullSentenceZh: 虽然很紧张，他还是在会上努力发了言。
        levels:
          - level: 1
            label: 核心句
            en: He made an effort.
            zh: 他努力了。
            highlight: ''
            hint: 先说他努力了
          - level: 2
            label: 加目的
            en: He made an effort to speak up in the meeting.
            zh: 他在会上努力发言了。
            highlight: to speak up in the meeting
            hint: 补上努力发言
          - level: 3
            label: 完整句
            en: He made an effort to speak up in the meeting, even though he was nervous.
            zh: 虽然很紧张，他还是在会上努力发了言。
            highlight: even though he was nervous
            hint: 补上虽然很紧张
      - key: make-mind-build
        type: sentence_decomposition
        title: 把还没想好的理由说完整
        sourceKind: chunk
        sourceText: make up one's mind
        fullSentence: I haven't made up my mind yet, so I need more time to think.
        fullSentenceZh: 我到现在还没拿定主意，所以还需要点时间考虑。
        levels:
          - level: 1
            label: 核心句
            en: I haven't made up my mind.
            zh: 我没拿定主意。
            highlight: ''
            hint: 先说没拿定主意
          - level: 2
            label: 加时间
            en: I haven't made up my mind yet.
            zh: 我到现在还没拿定主意。
            highlight: yet
            hint: 补上到现在还没
          - level: 3
            label: 完整句
            en: I haven't made up my mind yet, so I need more time to think.
            zh: 我到现在还没拿定主意，所以还需要点时间考虑。
            highlight: so I need more time to think
            hint: 补上还需要点时间考虑
